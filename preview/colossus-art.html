<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 registered art inspection</title><style>body{font:16px system-ui;background:#e8ebdd;color:#263b30;margin:16px}h1{font-size:24px}canvas{display:block;width:min(640px,100%);height:auto}label{display:inline-block;margin:8px}select{padding:8px;font:inherit}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;max-width:1250px}.grid img{width:100%;background:#53604a}.grid figure{margin:0}figcaption{font-size:12px}button{padding:10px}small{display:block}</style><h1>Colossus — registered frame inspection</h1><p>Technical art gate: genuine directional keyposes; geometry overlays are inspection-only.</p><label>Direction <select id="direction"><option>north</option><option>east</option><option>south</option><option>west</option></select></label><label>Pose <select id="pose"><option>idle</option><option>airborne</option><option>landing</option><option>hit</option><option>fatigued</option><option>wounded</option><option>look</option></select></label><label>Height <input id="height" type="range" min="0" max="64" value="0"></label><canvas id="canvas" width="768" height="768"></canvas><small>Nominal world and Guardian scale unchanged. Floor ellipse/contact anchor fixed; image framing includes transparent padding.</small><h2>All registered frames</h2><div class="grid"></div><script type="module">
import {COLOSSUS_ART as A} from '../src/colossus-art.mjs';const $=s=>document.querySelector(s),c=$('#canvas'),g=c.getContext('2d');const images={};for(const key of Object.keys(A.images)){const im=new Image();im.src='../assets/colossus/frames/'+key+'.png';await im.decode();images[key]=im;const f=document.createElement('figure');f.innerHTML='<img src="'+im.src+'"><figcaption>'+key+'</figcaption>';$('.grid').append(f);}const hull=new Image(),barrel=new Image();hull.src='../assets/guardian/hull.svg';barrel.src='../assets/guardian/barrel.svg';await Promise.all([hull.decode(),barrel.decode()]);
function draw(){g.fillStyle='#53604a';g.fillRect(0,0,768,768);g.save();g.translate(384,416);g.strokeStyle='#d9cb8e';g.beginPath();g.ellipse(0,0,112,64,0,0,Math.PI*2);g.stroke();g.fillStyle='#152d2455';g.beginPath();g.ellipse(0,0,112,55,0,0,Math.PI*2);g.fill();const key=$('#direction').value+'_'+$('#pose').value;g.drawImage(images[key],-A.anchor[0]*A.worldPerPixel,-A.anchor[1]*A.worldPerPixel-Number($('#height').value),A.frame*A.worldPerPixel,A.frame*A.worldPerPixel);g.strokeStyle='#fff';g.beginPath();g.moveTo(-4,0);g.lineTo(4,0);g.moveTo(0,-4);g.lineTo(0,4);g.stroke();g.restore();g.save();g.translate(64,704);g.rotate(-Math.PI/2);g.scale(.5,.5);g.drawImage(barrel,-107,-128);g.drawImage(hull,-107,-128);g.restore();window.artReady=true;}
for(const e of document.querySelectorAll('select,input'))e.oninput=draw;draw();</script></html>
